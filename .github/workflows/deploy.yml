name: deploy

on:
  push:
    branches: [main]
    paths: ['content/**', 'src/**', 'styles/**', 'tools/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check file casing
        # Runs before Test on purpose. A file committed as foo.csproj while the solution references
        # Foo.csproj builds on Windows and fails on the Linux runner with "project not found". On
        # 18d5eb7 that surfaced as a bare Test failure with every later step skipped. This step names
        # the real cause in one line instead.
        run: node tools/check-casing.mjs

      - name: Test
        run: dotnet test

      - name: Install Tailwind CLI
        run: npm ci --prefix tools/node-tools

      - name: Build site CSS
        run: >
          node tools/node-tools/node_modules/@tailwindcss/cli/dist/index.mjs
          -i styles/site.css -o dist-assets/site.css --minify

      - name: Build admin CSS
        run: >
          node tools/node-tools/node_modules/@tailwindcss/cli/dist/index.mjs
          -i styles/admin.css -o src/StaticBlaze.Admin/wwwroot/assets/admin.css --minify

      - name: Generate site
        # --css ships the built stylesheet as part of generation, so no hand copy is needed later.
        # the generator also copies styles/vendor (GSAP + Three.js) into dist/assets/vendor itself.
        run: >
          dotnet run --project src/StaticBlaze.Generator --
          --content content --out dist --css dist-assets/site.css
          --static styles/static --vendor styles/vendor --fonts styles/fonts

      - name: Publish admin
        run: dotnet publish src/StaticBlaze.Admin -c Release -o admin-published

      - name: Assemble Pages artifact
        # one workflow serves both repos: on the user site (sudoscratchy.github.io) the admin
        # lives at /admin/, on the project site (StaticBlaze) at /StaticBlaze/admin/ - derived
        # from the repository name so a sync never has to patch this file per repo.
        run: |
          BASE_PATH="/${{ github.event.repository.name }}"
          if [ "$BASE_PATH" = "/sudoscratchy.github.io" ]; then BASE_PATH=""; fi
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE_PATH/admin/\" />|" admin-published/wwwroot/index.html
          mkdir -p dist/admin
          cp -r admin-published/wwwroot/* dist/admin/
          echo > dist/.nojekyll
          # custom domain: echo "your.domain" > dist/CNAME

      - name: Quality gates
        # these scripts exit non-zero on failure, so a stale route, a broken internal link, a duplicate
        # canonical, a thin meta description, leftover tokens from a previous design, or a colour-mix
        # surface that would render transparent on an engine without @supports all fail the build.
        # run after assembly so dist/admin/ exists and the internal link check sees the whole tree.
        run: |
          test -s dist/assets/site.css || { echo "dist/assets/site.css is missing or empty"; exit 1; }
          test -s dist/assets/vendor/gsap.min.js || { echo "vendored GSAP is missing"; exit 1; }
          test -s dist/assets/vendor/three.module.min.js || { echo "vendored Three.js is missing"; exit 1; }
          test -s dist/assets/motion.js || { echo "motion.js is missing"; exit 1; }
          test -s dist/assets/scene.js || { echo "scene.js is missing"; exit 1; }
          node tools/audit-site.mjs dist
          node tools/check-crossengine.mjs dist/assets/site.css
          # note: tools/parity.mjs needs the previous revision's build, so it is a local gate:
          #   git worktree add /tmp/prev HEAD~1 --detach
          #   dotnet run --project /tmp/prev/src/StaticBlaze.Generator -- --content /tmp/prev/content --out /tmp/prev-dist
          #   node tools/parity.mjs /tmp/prev-dist dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published site
        # A green pipeline can still publish the wrong content. If the repository Pages Source is
        # "Deploy from a branch" rather than "GitHub Actions", GitHub's legacy Jekyll build also
        # publishes on every push and can overwrite this artifact - which is what happened here:
        # the artifact was briefly live, then a Jekyll render of README.md replaced it.
        # Without this step that is silent. With it, it is one clear line and a failed run.
        env:
          SITE_URL: ${{ github.server_url }}/${{ github.repository_owner }}.github.io/
        run: |
          ok=0
          # the pages CDN can keep serving the previous deployment for a few minutes while the
          # new one propagates (seen on 2026-10-10: deploy green, verify raced it, site was
          # correct 3 minutes later). poll for up to 8 minutes before declaring failure.
          for attempt in $(seq 1 32); do
            sleep 15
            html="$(curl -fsS "$SITE_URL/" || true)"
            if printf '%s' "$html" | grep -q 'class="cockpit"'; then
              echo "attempt $attempt: the built artifact is live"
              ok=1
              break
            fi
            echo "attempt $attempt: something else is being served"
          done
          if [ "$ok" -ne 1 ]; then
            echo ""
            echo "FAILED: the published site is not this build."
            echo "Most likely cause: Settings -> Pages -> Build and deployment -> Source is set"
            echo "to 'Deploy from a branch'. GitHub's legacy Jekyll build then publishes on every"
            echo "push and races this workflow. Set Source to 'GitHub Actions' and re-run."
            exit 1
          fi
          for path in posts contact archive tags; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/$path/")"
            echo "  /$path/ -> $code"
            if [ "$code" != "200" ]; then
            echo "FAILED: /$path/ did not return 200 from the published site"; exit 1
            fi
          done
          echo "published site verified: shell, index, contact, archive, tags"
